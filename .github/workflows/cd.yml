name: Deploy to AWS EC2

on:
  push:
    branches:
      - deploy

env:
  FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
  DB_URI: ${{ secrets.DB_URI }}
  API_KEY: ${{ secrets.API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH and deploy with docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FLASK_SECRET_KEY,DB_URI,API_KEY
          script: |
            echo "[0] Clone or pull repository"
            mkdir -p ~/app
            cd ~/app
            if [ ! -d "git" ]; then
              git clone https://github.com/couple-palace/couple-palace-backend.git git
            fi
            cd git
            git pull origin deploy

            script: |
  echo "[1] Generate .env file"
  echo "FLASK_SECRET_KEY=$FLASK_SECRET_KEY" > .env
  echo "DB_URI=$DB_URI" >> .env
  echo "API_KEY=$API_KEY" >> .env

  echo "[2] Start or restart containers"
  docker-compose down -v --remove-orphans || true
  docker-compose up --build -d

